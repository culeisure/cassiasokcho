<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>리플렛 미리보기</title>
<style>
  :root { --w100: 340px; --w97: 330px; --h: 714px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Pretendard, "Malgun Gothic", sans-serif; background: #232830; color: #e8e8e8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 60px; }
  h1 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 12.5px; color: #9aa2ad; margin-bottom: 20px; }
  .btns { display: flex; gap: 8px; margin-bottom: 26px; flex-wrap: wrap; justify-content: center; }
  .btns button { font: inherit; font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 8px; border: 1px solid #444c58; background: #2e3540; color: #dfe4ea; cursor: pointer; }
  .btns button.on { background: #d8b25a; border-color: #d8b25a; color: #241c05; }
  .hint { font-size: 12px; color: #8b93a0; margin-top: 18px; text-align: center; line-height: 1.6; }

  .stage-wrap { perspective: 2600px; }
  .book { position: relative; height: var(--h); transform-style: preserve-3d; transition: transform 0.8s ease; display: flex; }
  .pB { position: relative; width: var(--w100); height: var(--h); transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; backface-visibility: hidden; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.45); }
  .face img { width: 100%; height: 100%; display: block; }
  .face.back { transform: rotateY(180deg); }
  .pA { position: absolute; left: calc(-1 * var(--w100)); top: 0; width: var(--w100); height: var(--h); transform-origin: right center; transform-style: preserve-3d; transition: transform 1s ease; z-index: 30; }
  .pC { position: absolute; left: var(--w100); top: 0; width: var(--w97); height: var(--h); transform-origin: left center; transform-style: preserve-3d; transition: transform 1s ease; z-index: 20; }

  .s0 .pC { transform: rotateY(-180deg); }
  .s0 .pA { transform: rotateY(-180deg); }
  .s1 .pC { transform: rotateY(-180deg); }
  .s1 .pA { transform: rotateY(0deg); }
  .s2 .pC { transform: rotateY(0deg); }
  .s2 .pA { transform: rotateY(0deg); }
  .s3 .pC { transform: rotateY(0deg); }
  .s3 .pA { transform: rotateY(0deg); }
  .s3.book { transform: rotateY(180deg); }
  .holder { transition: transform 0.8s ease; }

  .flat { display: none; gap: 2px; }
  .flat img { height: var(--h); display: block; box-shadow: 0 8px 40px rgba(0,0,0,0.45); }
  body.flatmode .stage-wrap { display: none; }
  body.flatmode .flat.active { display: flex; }
  .flat-wrap { position: relative; }
  .cap { text-align: center; font-size: 12px; color: #9aa2ad; margin-top: 10px; }
</style>
</head>
<body>
<h1>리플렛 미리보기 (v11)</h1>
<div class="sub">버튼을 누르면 실제 접히는 순서대로 펼쳐집니다</div>

<div class="btns">
  <button id="b0" class="on">① 닫힌 표지</button>
  <button id="b1">② 표지 열기</button>
  <button id="b2">③ 완전히 펼치기</button>
  <button id="b3">④ 뒤집어 보기</button>
  <button id="b4">표지면 평면</button>
  <button id="b5">안쪽면 평면</button>
</div>

<div class="stage-wrap">
  <div class="holder" id="holder">
    <div class="book s0" id="book">
      <div class="pB">
        <div class="face front"><img src="fold/i3.png" alt=""></div>
        <div class="face back"><img src="fold/o6.png" alt=""></div>
        <div class="pA" id="pA">
          <div class="face front"><img src="fold/i2.png" alt=""></div>
          <div class="face back"><img src="fold/o1.png" alt=""></div>
        </div>
        <div class="pC" id="pC">
          <div class="face front"><img src="fold/i4.png" alt=""></div>
          <div class="face back"><img src="fold/o5.png" alt=""></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="flat-wrap">
  <div class="flat" id="flatOut"><img src="fold/o5.png"><img src="fold/o6.png"><img src="fold/o1.png"></div>
  <div class="flat" id="flatIn"><img src="fold/i2.png"><img src="fold/i3.png"><img src="fold/i4.png"></div>
</div>

<div class="cap" id="cap">닫힌 상태 · 표지가 보입니다</div>
<div class="hint">실제 인쇄 파일과 동일한 렌더를 면별로 잘라 만든 화면입니다.<br>인쇄물은 A4 가로 3단접지(말아접기)로 제작됩니다.</div>

<script>
(function () {
  var book = document.getElementById('book');
  var holder = document.getElementById('holder');
  var cap = document.getElementById('cap');
  var flatOut = document.getElementById('flatOut');
  var flatIn = document.getElementById('flatIn');
  var btns = ['b0','b1','b2','b3','b4','b5'].map(function (id) { return document.getElementById(id); });

  var caps = [
    '닫힌 상태 · 표지가 보입니다',
    '표지를 열면 · 왼쪽 내지와 오른쪽 접힘면이 함께 보입니다',
    '완전히 펼친 안쪽면 · 파노라마가 이어집니다',
    '뒤집어 본 표지면 전체 · 상단 파노라마가 이어집니다',
    '표지면 평면 · 인쇄 시 한 판',
    '안쪽면 평면 · 인쇄 시 한 판'
  ];

  function setStage(n) {
    btns.forEach(function (b, i) { b.classList.toggle('on', i === n); });
    cap.textContent = caps[n];
    if (n <= 3) {
      document.body.classList.remove('flatmode');
      book.className = 'book s' + n;
      var w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--w100'));
      holder.style.transform = (n === 1) ? ('translateX(' + (w / 2) + 'px)') : 'translateX(0)';
    } else {
      document.body.classList.add('flatmode');
      flatOut.classList.toggle('active', n === 4);
      flatIn.classList.toggle('active', n === 5);
    }
  }
  btns.forEach(function (b, i) { b.addEventListener('click', function () { setStage(i); }); });

  function fit() {
    var scale = Math.min(1, (window.innerWidth - 40) / 1040, (window.innerHeight - 240) / 714);
    document.documentElement.style.setProperty('--h', (714 * scale) + 'px');
    document.documentElement.style.setProperty('--w100', (340 * scale) + 'px');
    document.documentElement.style.setProperty('--w97', (330 * scale) + 'px');
  }
  fit(); window.addEventListener('resize', fit);
  setStage(0);
})();
</script>
</body>
</html>
